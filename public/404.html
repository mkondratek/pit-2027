<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex" />
    <title>Nie ma takiej strony — kalkulator PIT 2027</title>
    <style>
      :root {
        --tlo: #fbfaf8;
        --tekst: #1a1a1a;
        --tekst-cichy: #6b6b6b;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --tlo: #16161a;
          --tekst: #f2f0ec;
          --tekst-cichy: #a3a1a0;
        }
      }

      body {
        margin: 0 auto;
        max-width: 34rem;
        padding: 6rem 1.25rem;
        background: var(--tlo);
        color: var(--tekst);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
      }

      h1 {
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }

      p {
        color: var(--tekst-cichy);
        margin: 0 0 1.5rem;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Nie ma takiej strony</h1>
    <p>Pod tym adresem nic nie ma — być może literówka albo nieaktualny link.</p>
    <p><a href="/">→ przejdź do kalkulatora</a></p>
  </body>
</html>
