name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 wymaga Node 20.19+ albo 22.12+ — patrz README.
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
