    <script>
      (function () {
        var KLUCZ = 'pit-2027:bez-statystyk';
        try {
          var wybor = new URLSearchParams(location.search).get('bez-statystyk');

          else if (wybor === '0') localStorage.removeItem(KLUCZ);
          if (localStorage.getItem(KLUCZ)) return;
        } catch (e) {
          // Tryb prywatny bez localStorage — trudno, ta wizyta się policzy.

        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
